---
# Cluster connection
ocp4_workload_tenant_namespace_openshift_api_url: "{{ sandbox_openshift_api_url }}"
ocp4_workload_tenant_namespace_openshift_api_token: "{{ cluster_admin_agnosticd_sa_token | trim }}"

# User granted access to each namespace and used as the namespace name/prefix.
ocp4_workload_tenant_namespace_username: "user-{{ guid }}"

# Provision UUID applied as the demo.redhat.com/tenant-uuid label on every
# namespace the role creates.
ocp4_workload_tenant_namespace_uuid: "{{ guid }}"

# RBAC role bound to the user in each namespace.
ocp4_workload_tenant_namespace_role: admin

# Namespaces to create. Leave empty to create a single namespace named after
# the user (no suffix). Each entry requires 'suffix'.
# 'quota' merges onto the tenant quota and is used only when
# use_cluster_quota is false. 'limit_range' merges onto the tenant
# LimitRange and is applied to that namespace either way.
#
# ocp4_workload_tenant_namespace_suffixes:
# - suffix: myapp
#   quota:
#     limits.cpu: "4"
#     requests.cpu: "4"
#     limits.memory: 8Gi
#     requests.memory: 8Gi
#     requests.storage: 20Gi
#     pods: "50"          # optional — caps total pod count across all namespaces
#   limit_range:
#     default:
#       cpu: "2"
#       memory: 4Gi
#     defaultRequest:
#       cpu: 500m
#       memory: 1Gi
#   metadata:
#     labels:
#       opendatahub.io/dashboard: "true"
#     annotations:
#       openshift.io/display-name: "My App"
# - suffix: mydb   # no quota/limit_range/metadata — uses role defaults
ocp4_workload_tenant_namespace_suffixes: []

# Use an OpenShift ClusterResourceQuota (CRQ) scoped to the user's
# openshift.io/requester annotation. This shares a resource pool across
# role-created namespaces and projects requested by the user. Additional
# namespaces created by privileged automation must set that annotation.
# When false, a per-namespace ResourceQuota is applied instead — the role
# still sets the requester annotation on every namespace either way.
ocp4_workload_tenant_namespace_use_cluster_quota: true

# Full default quota. Catalog items do not set this name.
# ocp4_workload_tenant_namespace_default_quota is the overlay:
# keys it sets replace these values, keys it omits stay here.
# The numbers are placeholders.
_ocp4_workload_tenant_namespace_builtin_quota:
  limits.cpu: "4"
  requests.cpu: "4"
  limits.memory: "8Gi"
  requests.memory: "8Gi"
  requests.storage: "50Gi"
  persistentvolumeclaims: "10"
  pods: "50"
  services: "20"
  services.loadbalancers: "0"
  services.nodeports: "0"
  secrets: "50"
  configmaps: "50"
  "count/deployments.apps": "30"
  "count/replicasets.apps": "60"
  "count/statefulsets.apps": "10"
  "count/daemonsets.apps": "0"
  "count/jobs.batch": "20"
  "count/cronjobs.batch": "10"
  "count/routes.route.openshift.io": "20"
  "count/serviceaccounts": "20"
  "count/rolebindings.rbac.authorization.k8s.io": "20"
  "count/buildconfigs.build.openshift.io": "10"
  "openshift.io/imagestreams": "10"
  requests.ephemeral-storage: "10Gi"
  limits.ephemeral-storage: "20Gi"

# Container defaults only. No max.
# ocp4_workload_tenant_namespace_default_limit_range merges on top.
_ocp4_workload_tenant_namespace_builtin_limit_range:
  default:
    cpu: "2"
    memory: "4Gi"
  defaultRequest:
    cpu: "250m"
    memory: "128Mi"

# Overlay on the quota above.
# Keys set here replace the builtin value. Keys omitted here stay at the builtin.
# An empty overlay keeps the builtin quota.
# Used as ClusterResourceQuota hard limits when use_cluster_quota is true,
# or as the per-namespace ResourceQuota when use_cluster_quota is false
# and the suffix entry does not set quota.
ocp4_workload_tenant_namespace_default_quota: {}

# Overlay on the LimitRange above.
# Merged recursively: a catalog item can replace default.memory and leave
# default.cpu and defaultRequest in place.
ocp4_workload_tenant_namespace_default_limit_range: {}

# Per-tenant AdminNetworkPolicy. Off by default so internal tenant
# catalog items keep working without one. Set true for a customer-facing
# tenant that must stay isolated from other tenants on the same cluster.
ocp4_workload_tenant_namespace_admin_network_policy: false
