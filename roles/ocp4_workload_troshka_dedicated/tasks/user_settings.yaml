---
# Persist openshift.ingress_controller in system_config so Routes/showroom use
# the per-cluster rhdp.net domain (ingress-rhdp-net) instead of the default
# apps.<cluster>.infra.demo.redhat.com controller. Direct DB upsert so this
# works even before the admin/settings API ships in the backend image.
- name: Seed OpenShift IngressController setting
  when: troshka_ingress_controller | default('') != ''
  kubernetes.core.k8s_exec:
    namespace: "{{ troshka_namespace }}"
    pod: "{{ _backend_pod }}"
    container: backend
    command: >-
      python3 -c "
      from app.core.database import SessionLocal
      from app.models.system_config import SystemConfig
      key, val = 'openshift.ingress_controller', '{{ troshka_ingress_controller }}'
      db = SessionLocal()
      try:
          row = db.query(SystemConfig).filter_by(key=key).first()
          if row:
              row.value = val
          else:
              db.add(SystemConfig(key=key, value=val))
          db.commit()
          print(val)
      finally:
          db.close()
      "
  register: _ingress_controller_seed
  failed_when: _ingress_controller_seed.return_code != 0

- name: Configure pull-through registry
  when: pull_through_registry_url | default('') != ''
  block:
    - name: Build pull-through registry payload
      ansible.builtin.set_fact:
        _ptr_payload: >-
          {"pull_through_registry":true,
          "pull_through_registry_url":"{{ pull_through_registry_url }}",
          "pull_through_registry_user":"{{ pull_through_registry_user }}",
          "pull_through_registry_password":"{{ pull_through_registry_password }}"}

    - name: Set pull-through registry settings
      kubernetes.core.k8s_exec:
        namespace: "{{ troshka_namespace }}"
        pod: "{{ _backend_pod }}"
        container: backend
        command: >-
          curl -sf -X PUT
          http://localhost:8200/api/v1/auth/ocp-pull-secret
          -H "Content-Type: application/json"
          -H "X-Forwarded-Email: {{ _requester_identity }}"
          -d '{{ _ptr_payload }}'
      register: _ptr_result
      failed_when: _ptr_result.return_code != 0
