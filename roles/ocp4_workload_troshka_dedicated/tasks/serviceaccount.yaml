---
- name: Create ServiceAccount
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: troshka-sa
        namespace: "{{ troshka_namespace }}"

- name: Create Role for Troshka provider
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: troshka-provider
        namespace: "{{ troshka_namespace }}"
      rules:
        - apiGroups: ["kubevirt.io"]
          resources: ["virtualmachines", "virtualmachineinstances"]
          verbs: ["get", "list", "create", "delete", "patch", "update"]
        - apiGroups: ["cdi.kubevirt.io"]
          resources: ["datavolumes"]
          verbs: ["get", "list", "create", "delete"]
        - apiGroups: [""]
          resources: ["services", "persistentvolumeclaims"]
          verbs: ["get", "list", "create", "delete", "patch", "update"]
        - apiGroups: [""]
          resources: ["secrets"]
          verbs: ["get", "list", "create", "delete"]
        - apiGroups: ["route.openshift.io"]
          resources: ["routes"]
          verbs: ["get", "list", "create", "delete", "patch", "update"]
        # Explicit spec.host on app-proxy / showroom routes (rhdp.net domain)
        - apiGroups: ["route.openshift.io"]
          resources: ["routes/custom-host"]
          verbs: ["create", "update"]
        - apiGroups: [""]
          resources: ["pods"]
          verbs: ["get", "list"]
        - apiGroups: [""]
          resources: ["pods/exec"]
          verbs: ["create"]

- name: Create RoleBinding
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: troshka-provider
        namespace: "{{ troshka_namespace }}"
      subjects:
        - kind: ServiceAccount
          name: troshka-sa
          namespace: "{{ troshka_namespace }}"
      roleRef:
        kind: Role
        name: troshka-provider
        apiGroup: rbac.authorization.k8s.io

# Cluster-scoped: IngressController domain lookup + namespace guid label.
# Namespaced Role cannot grant these; shared ClusterRole, per-sandbox CRB.
- name: Create ClusterRole for IngressController / namespace guid
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: troshka-dedicated-ingress
      rules:
        - apiGroups: ["operator.openshift.io"]
          resources: ["ingresscontrollers"]
          verbs: ["get", "list"]
        - apiGroups: [""]
          resources: ["namespaces"]
          verbs: ["get", "patch"]

- name: Bind IngressController ClusterRole to provider SA
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: "troshka-dedicated-ingress-{{ troshka_namespace }}"
      subjects:
        - kind: ServiceAccount
          name: troshka-sa
          namespace: "{{ troshka_namespace }}"
      roleRef:
        kind: ClusterRole
        name: troshka-dedicated-ingress
        apiGroup: rbac.authorization.k8s.io

- name: Get SA token for provider registration
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: troshka-sa-token
        namespace: "{{ troshka_namespace }}"
        annotations:
          kubernetes.io/service-account.name: troshka-sa
      type: kubernetes.io/service-account-token
  register: _sa_token_secret

- name: Wait for SA token to be populated
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: troshka-sa-token
    namespace: "{{ troshka_namespace }}"
  register: _sa_token_info
  until: _sa_token_info.resources[0].data.token is defined
  retries: 10
  delay: 5

- name: Store SA token
  ansible.builtin.set_fact:
    _troshka_sa_token: "{{ _sa_token_info.resources[0].data.token | b64decode }}"

- name: Create backend ServiceAccount for in-cluster app self-update
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: troshka-backend
        namespace: "{{ troshka_namespace }}"
        labels:
          app.kubernetes.io/name: troshka-backend

- name: Create Role for Troshka app self-update (digest check + rollout restart)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: troshka-self-update
        namespace: "{{ troshka_namespace }}"
        labels:
          app.kubernetes.io/name: troshka-backend
      rules:
        - apiGroups: ["apps"]
          resources: ["deployments"]
          resourceNames: ["troshka-backend", "troshka-frontend", "troshka-worker"]
          verbs: ["get", "patch"]
        - apiGroups: [""]
          resources: ["pods"]
          verbs: ["get", "list"]

- name: Bind self-update Role to backend ServiceAccount
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: troshka-self-update
        namespace: "{{ troshka_namespace }}"
        labels:
          app.kubernetes.io/name: troshka-backend
      subjects:
        - kind: ServiceAccount
          name: troshka-backend
          namespace: "{{ troshka_namespace }}"
      roleRef:
        kind: Role
        name: troshka-self-update
        apiGroup: rbac.authorization.k8s.io
