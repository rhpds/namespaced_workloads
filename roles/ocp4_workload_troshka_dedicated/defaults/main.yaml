---
# Namespace -- use the sandbox-provisioned namespace
troshka_namespace: "{{ sandbox_openshift_namespace }}"

# Container images
troshka_backend_image: "quay.io/redhat-gpte/troshka-backend:latest"
troshka_frontend_image: "quay.io/redhat-gpte/troshka-frontend:latest"

# Host VM defaults (overridden by agnosticv parameters)
troshka_host_vcpus: 16
troshka_host_memory_gb: 64
troshka_host_disk_gb: 200

# HTTP package repo for host VM dnf (required — no DVD ISO fallback)
troshka_pkg_repo_url: ""
troshka_pkg_repo_username: ""
troshka_pkg_repo_password: ""

# Central image repo
troshka_seed_s3_endpoint: ""
troshka_seed_s3_bucket: "troshka-gold-images"
troshka_seed_s3_access_key: ""
troshka_seed_s3_secret_key: ""

troshka_seed_images: []

# Patterns expected in central S4 (synced via /library/sync-central).
# Each entry is a display name matched against Pattern.name after import.
troshka_seed_patterns: []

# Offer OCP 5.x (dev-preview) in the canvas / New Project version dropdown.
# Dedicated CIs are for early testing — keep this on by default.
troshka_preview_versions_enabled: true

# OpenShift IngressController for Troshka Routes / showroom. Per-cluster
# ingress-rhdp-net → apps.<cluster>.rhdp.net (requires guid label on namespaces).
troshka_ingress_controller: "ingress-rhdp-net"


# Resource limits
troshka_backend_cpu_request: "250m"
troshka_backend_memory_limit: "2Gi"
troshka_frontend_cpu_request: "100m"
troshka_frontend_memory_limit: "512Mi"

# Database
troshka_postgres_pvc_size: "10Gi"

# S4
troshka_s4_pvc_size: "2Ti"
troshka_s4_bucket: "troshka-images"
troshka_s4_endpoint: "http://troshka-s4.{{ troshka_namespace }}.svc:7480"
